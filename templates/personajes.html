<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Manager</title>
</head>
<body>

    <h1>RPG Manager</h1>

    <h2>Lista de Personajes</h2>

    <table border="1">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Clase</th>
                <th>Nivel</th>
                <th>Vida</th>
            </tr>
        </thead>

        <tbody>
            {% for p in personajes %}
            <tr>
                <td>{{ p["nombre"] }}</td>
                <td>{{ p["clase"] }}</td>
                <td>{{ p["nivel"] }}</td>
                <td>{{ p["vida"] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <h2>Crear Personaje</h2>

    <form action="/personajes" method="POST">

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required>

        <br><br>

        <label for="clase">Clase:</label>
        <input type="text" id="clase" name="clase" required>

        <br><br>

        <label for="nivel">Nivel:</label>
        <input type="number" id="nivel" name="nivel" required>

        <br><br>

        <label for="vida">Vida:</label>
        <input type="number" id="vida" name="vida" required>

        <br><br>

        <button type="submit">Crear Personaje</button>

    </form>

</body>
</html>
